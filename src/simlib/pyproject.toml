[project]
name = "simlib"
version = "0.1.0"
description = "Dependencies for the buoy simulator"
requires-python = ">=3.13,<=3.14"
dependencies = [
    "dask>=2026.7.1",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "haversine>=2.9.0",
    "netcdf4>=1.7.3",
    "numpy>=2.2.6",
    "polars>=1.43.0",
    "pyproj>=3.7.1",
    "xarray>=2025.6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
 
